  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://kddudi.goatcounter.com; connect-src 'self' https://kddudi.goatcounter.com; base-uri 'self'; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://carbfueling.com/it/calculator/" />

    <link rel="alternate" hreflang="pl" href="https://carbfueling.com/pl/calculator/" />

    <meta name="theme-color" content="#16191c" />

    <!-- Deliberately not the landing page's title/description: /it/ and /it/calculator/ are
         both indexable and self-canonical, so identical metadata on the two would read as a
         near-duplicate and let Google suppress one of them. The landing keeps the product
         line; this page describes the tool — what you put in, what you get out. -->
    <title>Piano percorso: borracce, gel, tappe — Carb Fueling</title>
    <meta
      name="description"
      content="Inserisci il tuo percorso, il tuo peso e le borracce che porti, e ottieni un piano: carboidrati e liquidi all'ora, cosa mettere in ogni borraccia e dove fermarti a fare rifornimento."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://carbfueling.com/it/calculator/" />
    <meta property="og:title" content="Piano percorso: borracce, gel, tappe — Carb Fueling" />
    <meta
      property="og:description"
      content="Inserisci il tuo percorso, il tuo peso e le borracce che porti, e ottieni un piano: carboidrati e liquidi all'ora, cosa mettere in ogni borraccia e dove fermarti a fare rifornimento."
    />
    <meta property="og:image" content="https://carbfueling.com/og-image.png" />
    <meta property="og:locale" content="it_IT" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:locale:alternate" content="pl_PL" />
    <meta property="og:locale:alternate" content="de_DE" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Piano percorso: borracce, gel, tappe — Carb Fueling" />
    <meta
      name="twitter:description"
      content="Inserisci il tuo percorso, il tuo peso e le borracce che porti, e ottieni un piano: carboidrati e liquidi all'ora, cosa mettere in ogni borraccia e dove fermarti a fare rifornimento."
    />
    <meta name="twitter:image" content="https://carbfueling.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Carb Fueling",
        "url": "https://carbfueling.com/it/calculator/",
        "description": "Pianifica quanti carboidrati e quanto liquido portare su un giro, e come distribuirli tra borracce, flask e cibo nel tempo.",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Any (runs in a web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Self-hosted instead of loaded from gc.zgo.at: keeps analytics off a third-party
         CDN that could otherwise serve modified JS with full page access. Update by
         re-downloading https://gc.zgo.at/count.js into public/count.js. -->
    <script data-goatcounter="https://kddudi.goatcounter.com/count" async src="/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
