<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://kddudi.goatcounter.com; connect-src 'self' https://kddudi.goatcounter.com; base-uri 'self'; form-action 'self';"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://carbfueling.com/pl/calculator/" />
    <link rel="alternate" hreflang="en" href="https://carbfueling.com/en/calculator/" />
    <link rel="alternate" hreflang="pl" href="https://carbfueling.com/pl/calculator/" />
    <link rel="alternate" hreflang="x-default" href="https://carbfueling.com/en/calculator/" />
    <meta name="theme-color" content="#16191c" />

    <!-- Deliberately not the landing page's title/description: /pl/ and /pl/calculator/ are
         both indexable and self-canonical, so identical metadata on the two would read as a
         near-duplicate and let Google suppress one of them. The landing keeps the product
         line; this page describes the tool — what you put in, what you get out. -->
    <title>Rozpiska na trasę: bidony, żele, postoje — Carb Fueling</title>
    <meta
      name="description"
      content="Podaj trasę, wagę i bidony, które bierzesz, a dostaniesz plan: węglowodany i płyny na godzinę, co wlać do każdego bidonu i gdzie zrobić postój."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://carbfueling.com/pl/calculator/" />
    <meta property="og:title" content="Rozpiska na trasę: bidony, żele, postoje — Carb Fueling" />
    <meta
      property="og:description"
      content="Podaj trasę, wagę i bidony, które bierzesz, a dostaniesz plan: węglowodany i płyny na godzinę, co wlać do każdego bidonu i gdzie zrobić postój."
    />
    <meta property="og:image" content="https://carbfueling.com/og-image.png" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:locale:alternate" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rozpiska na trasę: bidony, żele, postoje — Carb Fueling" />
    <meta
      name="twitter:description"
      content="Podaj trasę, wagę i bidony, które bierzesz, a dostaniesz plan: węglowodany i płyny na godzinę, co wlać do każdego bidonu i gdzie zrobić postój."
    />
    <meta name="twitter:image" content="https://carbfueling.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Carb Fueling",
        "url": "https://carbfueling.com/pl/calculator/",
        "description": "Zaplanuj, ile węglowodanów i płynów zabrać na trasę, i jak rozłożyć je na bidony, flaszki i jedzenie w czasie.",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Any (runs in a web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Self-hosted instead of loaded from gc.zgo.at: keeps analytics off a third-party
         CDN that could otherwise serve modified JS with full page access. Update by
         re-downloading https://gc.zgo.at/count.js into public/count.js. -->
    <script data-goatcounter="https://kddudi.goatcounter.com/count" async src="/count.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
