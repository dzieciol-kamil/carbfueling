      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https://kddudi.goatcounter.com; connect-src 'self' https://kddudi.goatcounter.com; base-uri 'self'; form-action 'self';"

    <link rel="alternate" hreflang="pl" href="https://carbfueling.com/pl/calculator/" />
    <link rel="alternate" hreflang="x-default" href="https://carbfueling.com/en/calculator/" />
    <meta name="theme-color" content="#16191c" />

    <title>Carb Fueling — carbohydrate &amp; hydration planner</title>
    <meta
      name="description"
      content="Plan how many carbs and how much fluid to take on a ride, and how to spread them across bottles, flasks and food over time. Free, no account, runs in your browser."
    />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://carbfueling.com/en/calculator/" />
    <meta property="og:title" content="Carb Fueling — carbohydrate &amp; hydration planner" />

      property="og:description"
      content="Plan how many carbs and how much fluid to take on a ride, and how to spread them across bottles, flasks and food over time. Free, no account, runs in your browser."
    />
    <meta property="og:image" content="https://carbfueling.com/og-image.png" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pl_PL" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Carb Fueling — carbohydrate &amp; hydration planner" />

      name="twitter:description"
      content="Plan how many carbs and how much fluid to take on a ride, and how to spread them across bottles, flasks and food over time. Free, no account, runs in your browser."
    />
    <meta name="twitter:image" content="https://carbfueling.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Carb Fueling",
        "url": "https://carbfueling.com/en/calculator/",
        "description": "Plan how many carbs and how much fluid to take on a ride, and how to spread them across bottles, flasks and food over time.",
        "applicationCategory": "SportsApplication",
        "operatingSystem": "Any (runs in a web browser)",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Self-hosted instead of loaded from gc.zgo.at: keeps analytics off a third-party
         CDN that could otherwise serve modified JS with full page access. Update by
         re-downloading https://gc.zgo.at/count.js into public/count.js. -->
    <script data-goatcounter="https://kddudi.goatcounter.com/count" async src="/count.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
